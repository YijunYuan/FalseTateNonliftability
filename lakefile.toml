name = "FalseTateNonliftability"
version = "0.1.0"
requiresModuleSystem = true
defaultTargets = ["FalseTateNonliftability"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "1e75e9dd53d483fa01eff9ac7d4ea0472ce9d1fa"

[[require]]
name = "FontaineWintenberger"
git = "https://github.com/YijunYuan/FontaineWintenberger"
rev = "7f43e30506d355ea81b0ea2bbb0b07680203ccec"

[[require]]
name = "FalseTateExtension"
git = "https://github.com/YijunYuan/FalseTateExtension"
rev = "2040c7ea259f8a10e326d55f5771959e0851328b"

[[lean_lib]]
name = "FalseTateNonliftability"
