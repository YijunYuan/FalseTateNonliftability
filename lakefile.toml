name = "FalseTateNonliftability"
version = "0.1.0"
requiresModuleSystem = true
defaultTargets = ["FalseTateNonliftability"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "f0b4c8150aa0dbc758aff1291410c5ae335aff3a"

[[require]]
name = "FalseTateExtension"
git = "https://github.com/YijunYuan/FalseTateExtension"
rev = "7d6876cbe08865a452911fdf43e4d0728e1ce903"

[[lean_lib]]
name = "FalseTateNonliftability"
